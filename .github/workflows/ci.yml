name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run CI on demand without an empty commit.
  workflow_dispatch: {}

# One run per ref: pushing twice in quick succession supersedes the older run
# instead of burning two runner slots on the same commit series.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this workflow only reads the repo and publishes a
# coverage artifact.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
